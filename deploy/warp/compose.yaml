name: omp-warp
x-warp: &warp
  build: .
  image: omp-bridge-warp:local
  cap_add: [NET_ADMIN]
  devices: [/dev/net/tun:/dev/net/tun]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 0
  restart: unless-stopped
  logging:
    options:
      max-size: 1m
      max-file: "1"
services:
  warp-a:
    <<: *warp
    ports: ["127.0.0.1:18090:8888"]
    volumes: [warp-a:/var/lib/cloudflare-warp]
  warp-b:
    <<: *warp
    ports: ["127.0.0.1:18091:8888"]
    volumes: [warp-b:/var/lib/cloudflare-warp]
  warp-c:
    <<: *warp
    ports: ["127.0.0.1:18092:8888"]
    volumes: [warp-c:/var/lib/cloudflare-warp]
  warp-d:
    <<: *warp
    ports: ["127.0.0.1:18093:8888"]
    volumes: [warp-d:/var/lib/cloudflare-warp]
  warp-e:
    <<: *warp
    ports: ["127.0.0.1:18094:8888"]
    volumes: [warp-e:/var/lib/cloudflare-warp]
  warp-f:
    <<: *warp
    ports: ["127.0.0.1:18095:8888"]
    volumes: [warp-f:/var/lib/cloudflare-warp]
  warp-g:
    <<: *warp
    ports: ["127.0.0.1:18096:8888"]
    volumes: [warp-g:/var/lib/cloudflare-warp]
  warp-h:
    <<: *warp
    ports: ["127.0.0.1:18097:8888"]
    volumes: [warp-h:/var/lib/cloudflare-warp]
  warp-i:
    <<: *warp
    ports: ["127.0.0.1:18098:8888"]
