  warp-j:
    <<: *warp
    ports: ["127.0.0.1:18099:8888"]
    volumes: [warp-j:/var/lib/cloudflare-warp]
volumes:
  warp-a:
  warp-b:
  warp-c:
  warp-d:
  warp-e:
  warp-f:
  warp-g:
  warp-h:
  warp-i:
  warp-j:
